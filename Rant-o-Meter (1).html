<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rant-o-Meter</title>
<style>
  :root {
    --brennan: #ff6329;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a2a2e, #141416);
    color: #fff;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #1e1e22;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 32px 28px 36px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    letter-spacing: 0.5px;
  }
  .sub {
    margin: 0 0 24px;
    font-size: 13px;
    color: #999;
  }
  .count {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    color: var(--brennan);
    transition: transform 0.12s ease;
  }
  .count.pop { transform: scale(1.25); }
  .out-of {
    font-size: 16px;
    color: #777;
    margin-bottom: 22px;
  }
  .meter {
    width: 100%;
    height: 26px;
    background: #2c2c30;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #3a3a3f;
    margin-bottom: 8px;
  }
  .fill {
    height: 100%;
    width: 0%;
    border-radius: 14px 0 0 14px;
    background: linear-gradient(90deg, #ffb347, var(--brennan), #d33);
    transition: width 0.35s cubic-bezier(.4,1.4,.5,1);
  }
  .status {
    font-size: 14px;
    min-height: 20px;
    margin: 10px 0 24px;
    color: #ffb347;
    font-weight: 600;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    padding: 14px 20px;
    transition: transform 0.08s ease, filter 0.2s ease;
  }
  button:active { transform: translateY(2px) scale(0.98); }
  .rant-btn {
    width: 100%;
    font-size: 18px;
    background: var(--brennan);
    color: #fff;
    box-shadow: 0 6px 0 #b8431a;
    margin-bottom: 12px;
  }
  .rant-btn:active { box-shadow: 0 2px 0 #b8431a; }
  .rant-btn:disabled {
    background: #555;
    box-shadow: 0 6px 0 #333;
    cursor: not-allowed;
    filter: grayscale(0.4);
  }
  .reset-btn {
    background: transparent;
    color: #888;
    border: 1px solid #444;
    font-size: 13px;
    padding: 8px 16px;
  }
  .reset-btn:hover { color: #fff; border-color: #666; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔥 Rant-o-Meter</h1>
    <p class="sub">Click every time the day earns it.</p>

    <div class="count" id="count">0</div>
    <div class="out-of">out of 20</div>

    <div class="meter"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">All calm... for now. 😌</div>

    <button class="rant-btn" id="rantBtn">😤 Log a Rant</button>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

<script>
  const MAX = 20;
  let count = 0;

  const countEl  = document.getElementById('count');
  const fillEl   = document.getElementById('fill');
  const statusEl = document.getElementById('status');
  const rantBtn  = document.getElementById('rantBtn');
  const resetBtn = document.getElementById('resetBtn');

  const stages = [
    { at: 0,  msg: "All calm... for now. 😌" },
    { at: 1,  msg: "And so it begins. ☕" },
    { at: 4,  msg: "Warming up nicely. 🌡️" },
    { at: 8,  msg: "Someone put a colon in a script, didn't they? 😑" },
    { at: 12, msg: "Steam detected. 💨" },
    { at: 16, msg: "Perimeter needs checking. 🚨" },
    { at: 19, msg: "One more and it's a full meltdown... 🌋" },
    { at: 20, msg: "MAXIMUM RANT ACHIEVED. Go get a coffee. 🏆" }
  ];

  function render() {
    countEl.textContent = count;
    fillEl.style.width = (count / MAX * 100) + '%';

    let msg = stages[0].msg;
    for (const s of stages) { if (count >= s.at) msg = s.msg; }
    statusEl.textContent = msg;

    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');

    rantBtn.disabled = count >= MAX;
    if (count >= MAX) rantBtn.textContent = "🧯 Meter's Full";
    else rantBtn.textContent = "😤 Log a Rant";
  }

  rantBtn.addEventListener('click', () => {
    if (count < MAX) { count++; render(); }
  });
  resetBtn.addEventListener('click', () => {
    count = 0;
    rantBtn.disabled = false;
    render();
  });

  render();
</script>
</body>
</html>
